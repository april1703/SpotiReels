services:
# the main app
 main-app:
  container-name: SpotiReelsTagram
  build: ./app/main
  env_file: ./app/.env
  volumes:
  - ./app/main:/app/main
  depends_on:
    service-server:
      condition: service_healthy

# the server to process requests
 service-server:
  container-name: main-server
  build: ./server/backend
  env_file: ./server/.env
  volumes:
  - ./server/backend:/server/main/backend
  depends_on:
    user-sql:
      condition: service_healthy

# the sql containers
 user-sql:
  container_name: user-sql
  image: mysql:8.0
  build: ./sql/users
  env_file: ./sql/users/.env
  ports: "3307:3306"
  volumes:
  - ./sql:/docker-entrypoint-initdb.d
  - mysql_data:/var/lib/mysql
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
    timeout: 20s
    retries: 5