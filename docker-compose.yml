services:
# the sql containers
 mysql-users:
  container_name: users-sql
  image: mysql
  environment: 
  - MYSQL_ROOT_PASSWORD=lakwdmoanwdoianksndakna
  - MYSQL_ROOT_HOST=%
  - MYSQL_USER=service-server
  - MYSQL_PASSWORD=test-password
  ports: 
  - "3307:3306"
  volumes:
  - ./sql/users:/docker-entrypoint-initdb.d/
  networks:
  - main-network


# the main app
 main-app:
  image: alpine
  build: ./app/main
  env_file: ./app/.env
  volumes:
  - ./app/main:/app/main

# the server to process requests
 service-server:
  build: ./server
  env_file: ./server/.env
  depends_on:
  - mysql-users
  networks:
  - main-network
  ports:
  - "5002:5002"
# Network setup
networks:
  main-network:
    driver: bridge